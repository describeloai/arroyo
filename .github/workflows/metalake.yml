# MetaLake in Arroyo, checked at two costs. `planner` plans a query over MetaLake's names through Arroyo's own planner,
# against a Postgres catalog: a few minutes once its cache is warm, and where a mistake in the hook shows first.
# `image` builds Arroyo's image once per commit, after the planner passes, and publishes it, so that MetaLake's
# end-to-end test runs Arroyo without building it.
name: metalake

on:
  push:
    branches:
      - master
      - 'feat/metalake-**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: metalake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planner:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Room on the disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: A catalog
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17 \
            -c track_commit_timestamp=on
          until docker exec pg pg_isready -q -U postgres; do sleep 1; done; sleep 2
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake clang libsasl2-dev libcurl4-openssl-dev
      - name: Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: metalake-planner
      - name: The planner over MetaLake's names
        run: cargo test -p arroyo-planner metalake -- --nocapture

  image:
    if: github.event_name != 'pull_request'
    needs: planner
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
      - uses: actions/checkout@v4
      - name: Names
        id: names
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/arroyo-metalake" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          echo "rust=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tagged by commit, to pin, and by branch, for the latest of it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: arroyo
          build-args: |
            GIT_SHA=${{ github.sha }}
            RUST_VERSION=${{ steps.names.outputs.rust }}
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:${{ github.sha }}
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.branch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ steps.names.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.names.outputs.image }}:buildcache,mode=max
